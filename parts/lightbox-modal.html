<!-- wp:html -->
<div id="lightboxModal" class="fixed inset-0 z-50 hidden items-center justify-center pt-8" style="background-color: rgba(0, 0, 0, 0.7);">
  <div class="relative p-4 sm:p-12 rounded-lg shadow-lg max-h-full max-w-full w-full h-auto">
    <button id="closeLightboxBtn" class="fixed top-10 right-2 transition duration-300 text-white hover:text-red-500 text-5xl cursor-pointer z-50">&times;</button>

    <div class="relative flex flex-col items-center justify-center">
      <!-- Image Title -->
      <h3 id="lightboxTitle" class="text-white text-xl font-semibold mb-4 text-center px-4"></h3>
      
      <!-- Left Chevron -->
      <button id="prevLightboxSlide" class="absolute -left-8 sm:-left-12 top-1/2 -translate-y-1/2 text-white text-4xl sm:text-5xl p-2 rounded-full focus:outline-none z-10 transition hover:text-gray-300">
        &#10094;
      </button>

      <!-- Image Container -->
      <div class="overflow-hidden w-full max-w-full rounded-md">
        <div id="lightboxSlider" class="flex items-center justify-center">
          <img id="lightboxImage" src="" alt="Lightbox Image" class="max-h-[80vh] max-w-full h-auto w-auto mx-auto" style="transition: opacity 0.3s ease-in-out;" />
        </div>
      </div>

      <!-- Right Chevron -->
      <button id="nextLightboxSlide" class="absolute -right-8 sm:-right-12 top-1/2 -translate-y-1/2 text-white text-4xl sm:text-5xl p-2 rounded-full focus:outline-none z-10 transition hover:text-gray-300">
        &#10095;
      </button>

      <!-- Image counter -->
      <div id="lightboxCounter" class="text-white mt-4 text-sm"></div>
    </div>
  </div>
</div>
<!-- /wp:html -->
